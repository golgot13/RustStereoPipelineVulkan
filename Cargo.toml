[package]
name = "rust-stereo-pipeline-vulkan"
version = "0.2.0"
edition = "2021"
description = "Rust + Vulkan Compute recode of the Ames Stereo Pipeline with CLI, egui Studio, Native X11, and Web UI"
license = "Apache-2.0"

[lib]
name = "stereo_pipeline"
path = "src/lib.rs"

[[bin]]
name = "stereo-pipeline"
path = "src/main.rs"

[features]
default = ["egui-ui", "laz-lidar"]
# Optional egui/eframe desktop UI; compile with `--no-default-features` for 100% zero external crates
egui-ui = ["dep:eframe"]
# Optional pure-Rust LAS/LAZ LiDAR HD reader for IGN_DATA local MNT/MNS terrain guidance
laz-lidar = ["dep:las"]

[dependencies]
eframe = { version = "0.31", optional = true }
las = { version = "0.9", features = ["laz"], optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
