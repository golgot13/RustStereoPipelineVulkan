[package]
name = "rust-stereo-pipeline-vulkan"
version = "0.1.0"
edition = "2021"
description = "Rust + Vulkan Compute recode of the Ames Stereo Pipeline with CLI, egui Studio, Native X11, and Web UI"
license = "Apache-2.0"

[lib]
name = "stereo_pipeline"
path = "src/lib.rs"

[[bin]]
name = "stereo-pipeline"
path = "src/main.rs"

[features]
default = ["egui-ui"]
# Optional egui/eframe desktop UI; compile with `--no-default-features` for 100% zero external crates
egui-ui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.31", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
