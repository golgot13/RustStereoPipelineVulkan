[package]
name = "rust-stereo-pipeline-vulkan"
version = "0.2.0"
edition = "2021"
description = "100% Zero-Dependency Pure-Rust + Vulkan Compute Aerial Stereo Photogrammetry Pipeline with Real-Time 2D/3D Web Workstation & LAS/LAZ/COPC LiDAR HD Engine"
license = "Apache-2.0"

[lib]
name = "stereo_pipeline"
path = "src/lib.rs"

[[bin]]
name = "stereo-pipeline"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
